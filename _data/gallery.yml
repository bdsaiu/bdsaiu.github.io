title: Gallery

subtitle: >
  Moments from BDSA gatherings, cultural celebrations, and community
  events at Indiana University Bloomington.

# ======================================================================
# Albums (newest first)
#
# To add an event:
#   1. python3 tools/prepare_album.py <folder with the original photos> <slug>
#      (writes web-sized copies to assets/images/gallery/<slug>/full and /thumb;
#      keep the original folder out of git, see .gitignore)
#   2. Add an entry below. Every photo in the album folder is shown in the grid;
#      "highlights" (file names in the album folder) are shown in the slideshow.
# ======================================================================

