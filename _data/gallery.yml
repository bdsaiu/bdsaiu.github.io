title: Gallery

subtitle: >
  Moments from BDSA gatherings, cultural celebrations, and community
  events at Indiana University Bloomington.

# ======================================================================
# Programs and their yearly albums
#
# The page shows one section per program (in the order below), and inside
# it one album per year (list the newest year first).
#
# To add photos of an event:
#   1. python3 tools/prepare_album.py <folder with the original photos> <album slug>
#      (writes web-sized copies to assets/images/gallery/<album slug>/full and /thumb;
#      keep the original folder out of git, see .gitignore)
#   2. Add an album entry under its program below (or a new program).
#      Every photo in the album folder is shown in the grid;
#      "highlights" (file names in the album folder) are shown in the slideshow.
# ======================================================================

programs:

  - slug: fall-picnic
    name: Fall Picnic
    description: >
      Our annual autumn get-together for students, families, and friends
      of the Bangladeshi community in Bloomington.
    albums:

      - slug: bdsa-fall-picnic-2026
        title: BDSA Fall Picnic 2026
        year: 2026
        date: October 11, 2026
        season: Fall 2026
        description: >
          Our annual Fall Picnic brought together new and returning students,
          families, and friends from the Bangladeshi community for an afternoon
          of food, games, prizes, and autumn colors by the lake.
